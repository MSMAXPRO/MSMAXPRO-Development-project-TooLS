<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typer - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --correct-green: #4ade80;
            --error-red: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--accent-glow);
        }

        .stat-box {
            font-weight: 800;
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-box span { 
            color: var(--primary-purple); 
            font-size: 1.4rem;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        #quote-display {
            font-size: 1.4rem;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #cbd5e1;
            min-height: 100px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            padding: 15px;
            border-radius: 12px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus { 
            border-color: var(--primary-purple);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .correct { color: var(--correct-green); }
        .incorrect { color: var(--error-red); background: rgba(248, 113, 113, 0.2); border-radius: 2px; }
        
        button {
            margin-top: 25px;
            padding: 14px 40px;
            background: var(--primary-purple);
            border: none;
            color: white;
            font-weight: 800;
            cursor: pointer;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>MSMAXPRO Speed Typer</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-box">Time: <span id="timer">60</span>s</div>
            <div class="stat-box">WPM: <span id="wpm">0</span></div>
            <div class="stat-box">Acc: <span id="accuracy">100</span>%</div>
        </div>

        <div id="quote-display">Initializing interface... Click Restart to begin.</div>
        
        <textarea id="quote-input" placeholder="Neural link standby... type to begin mission." disabled></textarea>
        
        <div style="text-align: center;">
            <button onclick="startGame()">Initiate Test</button>
        </div>
    </div>

    <script>
        const RANDOM_QUOTES = [
            "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            "The only way to do great work is to love what you do.",
            "Technology is best when it brings people together.",
            "JavaScript is the language of the web, turning static pages into dynamic experiences.",
            "Stay hungry, stay foolish. Innovation distinguishes between a leader and a follower.",
            "In a world of algorithms, never lose the human touch in your code."
        ];

        const quoteDisplay = document.getElementById('quote-display');
        const quoteInput = document.getElementById('quote-input');
        const timerElement = document.getElementById('timer');
        const wpmElement = document.getElementById('wpm');
        const accElement = document.getElementById('accuracy');

        let timer = 60;
        let timerInterval = null;
        let started = false;

        quoteInput.addEventListener('input', () => {
            if (!started) return;
            
            const arrayQuote = quoteDisplay.querySelectorAll('span');
            const arrayValue = quoteInput.value.split('');

            let correctChars = 0;
            let allCorrect = true;

            arrayQuote.forEach((characterSpan, index) => {
                const character = arrayValue[index];
                if (character == null) {
                    characterSpan.classList.remove('correct', 'incorrect');
                    allCorrect = false;
                } else if (character === characterSpan.innerText) {
                    characterSpan.classList.add('correct');
                    characterSpan.classList.remove('incorrect');
                    correctChars++;
                } else {
                    characterSpan.classList.remove('correct');
                    characterSpan.classList.add('incorrect');
                    allCorrect = false;
                }
            });

            // Calculate Stats
            let totalTyped = arrayValue.length;
            let accuracy = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 100;
            accElement.innerText = accuracy;

            let timeElapsed = 60 - timer;
            if (timeElapsed > 0) {
                let wpm = Math.round((correctChars / 5) / (timeElapsed / 60));
                wpmElement.innerText = wpm;
            }

            if (allCorrect) {
                renderNewQuote();
                quoteInput.value = '';
            }
        });

        function renderNewQuote() {
            const quote = RANDOM_QUOTES[Math.floor(Math.random() * RANDOM_QUOTES.length)];
            quoteDisplay.innerHTML = '';
            quote.split('').forEach(character => {
                const characterSpan = document.createElement('span');
                characterSpan.innerText = character;
                quoteDisplay.appendChild(characterSpan);
            });
        }

        function startGame() {
            clearInterval(timerInterval);
            timer = 60;
            started = true;
            timerElement.innerText = timer;
            wpmElement.innerText = 0;
            accElement.innerText = 100;
            
            quoteInput.disabled = false;
            quoteInput.value = '';
            quoteInput.focus();
            
            renderNewQuote();

            timerInterval = setInterval(() => {
                timer--;
                timerElement.innerText = timer;
                if (timer <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            started = false;
            quoteInput.disabled = true;
            quoteDisplay.innerText = "Mission Complete. Analyze your stats above.";
        }
    </script>
</body>
</html>
