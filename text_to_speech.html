<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Node - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 { 
            font-size: 1.2rem; 
            color: var(--primary-purple); 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            font-size: 0.95rem;
            color: white;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        
        textarea:focus { 
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            margin-bottom: 25px;
            cursor: pointer;
            outline: none;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Voice Node v1.0</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="container">
        <h2>Neural Speech Synthesizer</h2>
        <textarea id="text" placeholder="Enter text to translate into neural speech..."></textarea>
        
        <select id="voice-select">
            <option value="">ACQUIRING VOICE CORES...</option>
        </select>
        
        <button onclick="speak()">Activate Speech</button>
        <p class="status-msg">Powered by Local Web Speech Engine</p>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById('voice-select');
        let voices = [];

        function populateVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-name', voice.name);
                option.setAttribute('data-lang', voice.lang);
                voiceSelect.appendChild(option);
            });
        }

        // Initialize voices
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function speak() {
            if (synth.speaking) {
                console.error('Core occupied: Already synthesizing speech.');
                return;
            }
            
            const textInput = document.getElementById('text').value;
            if (textInput !== '') {
                const utterThis = new SpeechSynthesisUtterance(textInput);
                const selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
                
                voices.forEach((voice) => {
                    if (voice.name === selectedOption) {
                        utterThis.voice = voice;
                    }
                });

                // Styling for "Talking" state can be added here
                synth.speak(utterThis);
            }
        }
    </script>
</body>
</html>
