<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse Clock - CodeWithMsMaxPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: 'Inter', sans-serif;
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 5px;
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Container with Glassmorphism */
        .clock-container {
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            padding: 50px 70px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(139, 92, 246, 0.1);
            position: relative;
        }

        /* The Main Time Display */
        .time {
            font-family: 'Orbitron', sans-serif;
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            color: #fff;
            line-height: 1;
            
            /* Purple Neon Glow */
            text-shadow: 
                0 0 10px var(--primary-purple),
                0 0 20px var(--primary-purple),
                0 0 40px var(--primary-purple);
        }

        /* The AM/PM indicator */
        .session {
            font-size: 1.4rem;
            vertical-align: top;
            margin-left: 5px;
            color: var(--primary-purple);
            text-shadow: 0 0 10px var(--accent-glow);
            font-family: 'Inter', sans-serif;
            font-weight: 800;
        }

        /* Date Display below time */
        .date {
            margin-top: 25px;
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Blinking colon animation */
        .colon {
            animation: blink 1s infinite;
            color: var(--primary-purple);
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .time { font-size: 2.8rem; letter-spacing: 4px; }
            .clock-container { padding: 30px; width: 90%; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Temporal Node</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="clock-container">
        <div class="time" id="digital-clock">
            12<span class="colon">:</span>00<span class="colon">:</span>00 <span class="session" id="session">AM</span>
        </div>
        <div class="date" id="date-display">
            SYSTEM CALIBRATING...
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            let session = "AM";

            if (h == 0) {
                h = 12;
            }
            if (h > 12) {
                h = h - 12;
                session = "PM";
            }

            h = (h < 10) ? "0" + h : h;
            m = (m < 10) ? "0" + m : m;
            s = (s < 10) ? "0" + s : s;

            // Update Time HTML
            const timeHTML = `${h}<span class="colon">:</span>${m}<span class="colon">:</span>${s}<span class="session">${session}</span>`;
            document.getElementById("digital-clock").innerHTML = timeHTML;

            // Update Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', options);
            document.getElementById("date-display").textContent = dateString;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
