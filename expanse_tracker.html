<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --success-green: #22c55e;
            --error-red: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .balance-container {
            text-align: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--accent-glow);
            margin-bottom: 25px;
        }

        .balance-container h4 {
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .balance-val {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-white);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .inc-exp-container {
            display: flex;
            background: rgba(15, 23, 42, 0.4);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .inc-exp-container > div {
            flex: 1;
            text-align: center;
        }

        .inc-exp-container > div:first-of-type {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .inc-exp-container h4 {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .money { font-size: 1.2rem; font-weight: 800; }
        .plus { color: var(--success-green); }
        .minus { color: var(--error-red); }

        h3 { 
            font-size: 0.9rem;
            color: var(--primary-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: rgba(139, 92, 246, 0.2);
        }

        .list {
            list-style-type: none;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .list::-webkit-scrollbar { width: 4px; }
        .list::-webkit-scrollbar-thumb { background: var(--primary-purple); border-radius: 10px; }

        .list li {
            background: rgba(15, 23, 42, 0.5);
            color: var(--text-white);
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 12px;
            font-size: 0.9rem;
            border-left: 4px solid transparent;
        }

        .list li.plus { border-left-color: var(--success-green); }
        .list li.minus { border-left-color: var(--error-red); }

        .form-control { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.75rem; color: #94a3b8; font-weight: 700; }
        
        input, select {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            padding: 12px;
            width: 100%;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 800;
            margin-top: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Wallet Tracker</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="container">
        <div class="balance-container">
            <h4>NET BALANCE</h4>
            <div class="balance-val" id="balance">₹0.00</div>
        </div>

        <div class="inc-exp-container">
            <div>
                <h4>INFLOW</h4>
                <p class="money plus" id="money-plus">+₹0.00</p>
            </div>
            <div>
                <h4>OUTFLOW</h4>
                <p class="money minus" id="money-minus">-₹0.00</p>
            </div>
        </div>

        <h3>Recent Activity</h3>
        <ul id="list" class="list"></ul>

        <h3>New Log</h3>
        
        <div class="form-control">
            <label>Log Type</label>
            <select id="type">
                <option value="expense">Expense (Debit)</option>
                <option value="income">Income (Credit)</option>
            </select>
        </div>

        <div class="form-control">
            <label>Description</label>
            <input type="text" id="text" placeholder="e.g. Salary, Coffee...">
        </div>
        
        <div class="form-control">
            <label>Amount (₹)</label>
            <input type="number" id="amount" placeholder="0.00">
        </div>
        
        <button class="btn" onclick="addTransaction()">Push to Ledger</button>
    </div>

    <script>
        const balance = document.getElementById('balance');
        const money_plus = document.getElementById('money-plus');
        const money_minus = document.getElementById('money-minus');
        const list = document.getElementById('list');
        const text = document.getElementById('text');
        const amount = document.getElementById('amount');
        const typeSelect = document.getElementById('type');

        let transactions = [];

        function addTransaction() {
            if (text.value.trim() === '' || amount.value.trim() === '') {
                alert('Details required to log transaction.');
                return;
            }

            const type = typeSelect.value;
            let amountValue = +amount.value;
            amountValue = Math.abs(amountValue); 

            if (type === 'expense') {
                amountValue = -amountValue;
            }

            const transaction = {
                id: Math.floor(Math.random() * 100000000),
                text: text.value,
                amount: amountValue
            };

            transactions.push(transaction);
            addTransactionDOM(transaction);
            updateValues();

            text.value = '';
            amount.value = '';
        }

        function addTransactionDOM(transaction) {
            const sign = transaction.amount < 0 ? '-' : '+';
            const itemClass = transaction.amount < 0 ? 'minus' : 'plus';
            const item = document.createElement('li');
            item.classList.add(itemClass);
            
            const absAmount = Math.abs(transaction.amount);

            item.innerHTML = `
                ${transaction.text} <span>${sign}₹${absAmount.toLocaleString()}</span>
            `;

            list.insertBefore(item, list.firstChild); // Show newest at top
        }

        function updateValues() {
            const amounts = transactions.map(t => t.amount);
            const total = amounts.reduce((acc, item) => (acc += item), 0).toFixed(2);
            const income = amounts.filter(item => item > 0).reduce((acc, item) => (acc += item), 0).toFixed(2);
            const expense = (amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1).toFixed(2);

            balance.innerText = `₹${parseFloat(total).toLocaleString()}`;
            money_plus.innerText = `+₹${parseFloat(income).toLocaleString()}`;
            money_minus.innerText = `-₹${parseFloat(expense).toLocaleString()}`;
        }
    </script>
</body>
</html>
