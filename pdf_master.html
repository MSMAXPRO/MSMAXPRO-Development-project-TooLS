<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Master Pro - CodeWithMsMaxPro</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --success-green: #10b981;
            --error-red: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .drop-zone {
            border: 2px dashed rgba(139, 92, 246, 0.3);
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(15, 23, 42, 0.5);
            margin-bottom: 25px;
        }

        .drop-zone:hover {
            border-color: var(--primary-purple);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .drop-zone h3 {
            font-size: 1.1rem;
            color: var(--primary-purple);
            margin-bottom: 8px;
        }

        .file-list {
            margin-top: 20px;
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 18px;
            margin-bottom: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-name {
            font-size: 0.85rem;
            color: #cbd5e1;
            max-width: 80%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .btn-remove {
            background: transparent;
            color: var(--error-red);
            border: 1px solid var(--error-red);
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .btn-remove:hover {
            background: var(--error-red);
            color: white;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-action:disabled {
            background: #334155;
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .privacy-note {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>PDF Master Pro</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="container">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileIn').click()">
            <h3>SELECT PDF FILES</h3>
            <p style="color:#94a3b8; font-size: 0.8rem;">Click or Drag & Drop Here</p>
            <input type="file" id="fileIn" accept="application/pdf" multiple style="display: none">
        </div>

        <ul class="file-list" id="fileList"></ul>

        <button class="btn-action" id="mergeBtn" onclick="mergePDFs()" disabled>
            MERGE DOCUMENTS <div class="spinner" id="spinner"></div>
        </button>

        <p class="privacy-note">🔒 Local Processing: Your files never leave your device.</p>
    </div>

    <script>
        const fileIn = document.getElementById('fileIn');
        const fileList = document.getElementById('fileList');
        const mergeBtn = document.getElementById('mergeBtn');
        const spinner = document.getElementById('spinner');
        const dropZone = document.getElementById('dropZone');
        let filesArray = [];

        fileIn.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--primary-purple)'; });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.borderColor = 'rgba(139, 92, 246, 0.3)'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(139, 92, 246, 0.3)';
            handleFiles(e.dataTransfer.files);
        });

        async function handleFiles(files) {
            for (let file of files) {
                if (file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    filesArray.push({ name: file.name, data: arrayBuffer });
                }
            }
            renderList();
        }

        function renderList() {
            fileList.innerHTML = '';
            filesArray.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <span class="file-name">📄 ${file.name}</span>
                    <button class="btn-remove" onclick="removeFile(${index})">REMOVE</button>
                `;
                fileList.appendChild(li);
            });
            mergeBtn.disabled = filesArray.length < 2;
            if (filesArray.length < 2) {
                mergeBtn.innerHTML = `Add ${2 - filesArray.length} more PDF(s)`;
            } else {
                mergeBtn.innerHTML = 'MERGE DOCUMENTS <div class="spinner" id="spinner" style="display:inline-block"></div>';
            }
        }

        function removeFile(index) {
            filesArray.splice(index, 1);
            renderList();
        }

        async function mergePDFs() {
            const spin = document.getElementById('spinner');
            spin.style.display = 'inline-block';
            mergeBtn.innerHTML = "Processing...";
            mergeBtn.appendChild(spin);
            mergeBtn.disabled = true;

            try {
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();

                for (let fileObj of filesArray) {
                    const pdf = await PDFDocument.load(fileObj.data);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                download(pdfBytes, "MSMAXPRO_Merged.pdf", "application/pdf");
                
                mergeBtn.innerHTML = "DOWNLOAD SUCCESSFUL!";
                setTimeout(() => { renderList(); }, 2000);
            } catch (err) {
                alert("Critical Error: " + err);
                renderList();
            }
        }

        function download(data, filename, type) {
            const blob = new Blob([data], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
