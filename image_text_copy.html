<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Extractor - CodeWithMsMaxPro</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --success-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .upload-section {
            border: 2px dashed rgba(139, 92, 246, 0.3);
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(15, 23, 42, 0.5);
            margin-bottom: 25px;
            position: relative;
        }

        .upload-section:hover {
            border-color: var(--primary-purple);
            background: rgba(139, 92, 246, 0.05);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .upload-section h3 {
            font-size: 1.1rem;
            color: var(--primary-purple);
            margin-bottom: 8px;
        }

        .preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            border: 2px solid var(--primary-purple);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        button:disabled {
            background: #334155;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            background: #0f172a;
            height: 12px;
            border-radius: 6px;
            margin-top: 25px;
            overflow: hidden;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-purple), #a855f7);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--primary-purple);
        }

        .status-text {
            text-align: center;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            font-size: 0.95rem;
            margin-top: 25px;
            resize: vertical;
            line-height: 1.6;
            transition: 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-copy {
            width: auto;
            background: transparent;
            border: 1px solid var(--success-green);
            color: var(--success-green);
            padding: 10px 25px;
            font-size: 0.8rem;
            box-shadow: none;
        }

        .btn-copy:hover {
            background: var(--success-green);
            color: white;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>AI Text Scanner</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="container">
        <div class="upload-section" onclick="document.getElementById('fileIn').click()">
            <input type="file" id="fileIn" accept="image/*" style="display: none">
            <h3>SELECT IMAGE SOURCE</h3>
            <p style="color:#94a3b8; font-size: 0.8rem;">Drop JPG, PNG, or BMP here</p>
            <img id="preview" class="preview-img">
        </div>

        <button id="scanBtn" onclick="startScan()" disabled>INITIALIZE SCAN</button>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">System Standby</div>

        <textarea id="resultText" placeholder="Engine output will appear here after scanning..."></textarea>
        
        <div class="controls">
            <button class="btn-copy" onclick="copyText()">Copy To Clipboard</button>
        </div>
    </div>

    <script>
        const fileIn = document.getElementById('fileIn');
        const preview = document.getElementById('preview');
        const scanBtn = document.getElementById('scanBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const resultText = document.getElementById('resultText');

        let selectedFile = null;

        fileIn.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                scanBtn.disabled = false;
                scanBtn.innerText = "READY TO SCAN";
                resultText.value = "";
                document.querySelector('.upload-section h3').style.display = 'none';
                document.querySelector('.upload-section p').style.display = 'none';
                statusText.innerText = "Image Loaded Successfully";
            }
        });

        function startScan() {
            if (!selectedFile) return;

            scanBtn.disabled = true;
            scanBtn.innerText = "Processing...";
            progressBar.style.display = 'block';
            statusText.innerText = "Warming up OCR Engine...";

            Tesseract.recognize(
                selectedFile,
                'eng',
                {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const pct = Math.round(m.progress * 100);
                            progressFill.style.width = pct + "%";
                            statusText.innerText = `Analyzing Matrix... ${pct}%`;
                        } else {
                            statusText.innerText = m.status.toUpperCase();
                        }
                    }
                }
            ).then(({ data: { text } }) => {
                resultText.value = text;
                scanBtn.disabled = false;
                scanBtn.innerText = "NEW SCAN";
                statusText.innerText = "Extraction Complete!";
                progressFill.style.width = "100%";
            }).catch(err => {
                console.error(err);
                statusText.innerText = "CRITICAL ERROR: " + err.message;
                statusText.style.color = "var(--error-red)";
                scanBtn.disabled = false;
            });
        }

        function copyText() {
            if (!resultText.value) return;
            resultText.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerText;
            btn.innerText = "TEXT COPIED!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }
    </script>
</body>
</html>
