<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Paint Studio - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --error-red: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .header-box {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .toolbar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .color-btn:hover { transform: scale(1.2); }
        .color-btn.active { 
            border-color: white; 
            box-shadow: 0 0 15px currentColor;
            transform: scale(1.1);
        }

        #clear-btn {
            background: transparent;
            color: var(--error-red);
            border: 1px solid var(--error-red);
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-left: 10px;
        }

        #clear-btn:hover {
            background: var(--error-red);
            color: white;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        canvas {
            background: #000;
            border: 2px solid var(--card-bg);
            border-radius: 20px;
            cursor: crosshair;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            touch-action: none; /* Critical for mobile touch */
        }

        .brush-hint {
            position: absolute;
            bottom: -25px;
            font-size: 0.7rem;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Neon Paint Studio</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>
    
    <div class="toolbar">
        <div class="color-btn active" style="background: #8b5cf6; color: #8b5cf6;" onclick="setColor(this, '#8b5cf6')"></div>
        <div class="color-btn" style="background: #00f2ff; color: #00f2ff;" onclick="setColor(this, '#00f2ff')"></div>
        <div class="color-btn" style="background: #ff0077; color: #ff0077;" onclick="setColor(this, '#ff0077')"></div>
        <div class="color-btn" style="background: #39ff14; color: #39ff14;" onclick="setColor(this, '#39ff14')"></div>
        <div class="color-btn" style="background: #ffffff; color: #ffffff;" onclick="setColor(this, '#ffffff')"></div>
        <button id="clear-btn" onclick="clearCanvas()">RESET STAGE</button>
    </div>

    <div class="canvas-container">
        <canvas id="drawing-board"></canvas>
        <p class="brush-hint">Tip: Use your mouse or finger to create neon art</p>
    </div>

    <script>
        const canvas = document.getElementById('drawing-board');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#8b5cf6';

        // Dynamic Canvas Sizing
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Re-apply brush settings after resize
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            // Handle both mouse and touch events
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.strokeStyle = currentColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = currentColor;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function setColor(elem, color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            elem.classList.add('active');
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startPosition(e);
        });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        });
    </script>
</body>
</html>
