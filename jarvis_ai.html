<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. HUD - CodeWithMsMaxPro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --primary-purple: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --text-white: #f8fafc;
        }

        body { margin: 0; background: var(--bg-dark); overflow: hidden; font-family: 'Inter', 'Courier New', monospace; }
        
        .hud-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        video { position: absolute; min-width: 100%; min-height: 100%; object-fit: cover; opacity: 0.5; filter: grayscale(20%) contrast(1.2); }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(15, 23, 42, 0.9) 150%);
            pointer-events: none; z-index: 5;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .ui-layer { position: absolute; z-index: 20; width: 100%; height: 100%; pointer-events: none; }
        
        .corner { position: absolute; width: 60px; height: 60px; border: 2px solid var(--primary-purple); opacity: 0.7; filter: drop-shadow(0 0 5px var(--primary-purple)); }
        .tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .br { bottom: 30px; right: 30px; border-left: none; border-top: none; }

        .center-crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; border: 1px dashed rgba(139, 92, 246, 0.3); border-radius: 50%;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--primary-purple);
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 60px; height: 60px; border: 4px solid rgba(139, 92, 246, 0.1); border-top: 4px solid var(--primary-purple); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .sys-info {
            position: absolute; bottom: 40px; width: 100%; text-align: center; color: var(--primary-purple); font-weight: 800; letter-spacing: 3px; font-size: 0.8rem; text-shadow: 0 0 10px var(--primary-purple);
        }

        .web-label { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 0.7rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="loading-screen" id="loader">
        <div class="spinner"></div>
        <h2 id="status">INITIALIZING OPTICAL NEURAL CORE...</h2>
        <p style="font-size: 0.7rem; opacity: 0.6; margin-top: 10px;">MS-MAXPRO VISION MODULE v4.0</p>
    </div>

    <div class="hud-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="overlay"></div>
        
        <div class="ui-layer">
            <div class="web-label">CODEWITHMSMAXPRO.ME | INTELLIGENCE INTERFACE</div>
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="center-crosshair"></div>
            <div class="sys-info">
                STATUS: NEURAL LINK ESTABLISHED | SCANNING TARGETS
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('status');
        
        let model = null;

        async function setupCamera() {
            statusText.innerText = "CALIBRATING SENSORS...";
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve(video);
                };
            });
        }

        async function loadModel() {
            statusText.innerText = "UPLOADING NEURAL WEIGHTS...";
            model = await cocoSsd.load();
            statusText.innerText = "SYSTEM ACTIVE";
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 800);
            }, 600);
            detectFrame();
        }

        function detectFrame() {
            if (!model) return;
            model.detect(video).then(predictions => {
                renderPredictions(predictions);
                requestAnimationFrame(detectFrame);
            });
        }

        function renderPredictions(predictions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.font = 'bold 14px "Inter", sans-serif';
            ctx.lineWidth = 2;

            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                const label = prediction.class.toUpperCase();
                const confidence = Math.round(prediction.score * 100) + '%';
                const color = '#8b5cf6';

                // HUD Box Styling
                ctx.strokeStyle = color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = color;
                
                // Corner Borders Only for cleaner Tech look
                ctx.beginPath();
                const len = 15;
                ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
                ctx.moveTo(x + width - len, y); ctx.lineTo(x + width, y); ctx.lineTo(x + width, y + len);
                ctx.moveTo(x + width, y + height - len); ctx.lineTo(x + width, y + height); ctx.lineTo(x + width - len, y + height);
                ctx.moveTo(x + len, y + height); ctx.lineTo(x, y + height); ctx.lineTo(x, y + height - len);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Label Background
                ctx.fillStyle = 'rgba(139, 92, 246, 0.2)';
                const txtWidth = ctx.measureText(label + " | " + confidence).width;
                ctx.fillRect(x, y - 30, txtWidth + 15, 25);

                // Label Text
                ctx.fillStyle = "#fff";
                ctx.fillText(label + " | " + confidence, x + 8, y - 13);
                
                // Targeting Line to center
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(139, 92, 246, 0.2)';
                ctx.setLineDash([5, 5]);
                ctx.moveTo(canvas.width/2, canvas.height/2);
                ctx.lineTo(x + width/2, y + height/2);
                ctx.stroke();
                ctx.setLineDash([]);
            });
        }

        setupCamera().then(() => {
            loadModel();
        }).catch(err => {
            alert("SENSORS OFFLINE: " + err.message);
        });
    </script>
</body>
</html>
