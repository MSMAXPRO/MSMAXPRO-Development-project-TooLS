<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --success-green: #10b981;
            --error-red: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .hidden { display: none; }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .entry {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            margin-top: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .copy-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            background: var(--success-green);
            width: auto;
            padding: 6px 12px;
            font-size: 0.7rem;
            margin: 0;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid var(--error-red);
            color: var(--error-red);
            margin-top: 10px;
            font-size: 0.75rem;
            padding: 8px;
        }

        .delete-btn:hover {
            background: var(--error-red);
            color: white;
        }

        small { color: #94a3b8; display: block; text-align: center; margin-top: 15px; font-size: 0.75rem; }
        
        #entries-list::-webkit-scrollbar { width: 4px; }
        #entries-list::-webkit-scrollbar-thumb { background: var(--primary-purple); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Secure Vault</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="container" id="login-screen">
        <h2 style="text-align: center; color: var(--primary-purple); margin-bottom: 10px; font-size: 1.2rem;">ACCESS TERMINAL</h2>
        <p style="text-align: center; font-size: 0.75rem; color: #94a3b8; margin-bottom: 20px;">Zero-Knowledge Local Encryption</p>
        <input type="password" id="master-password" placeholder="Master Access Key">
        <button onclick="unlockVault()">Unlock Vault</button>
        <small>⚠ Caution: Forget your key, lose your data.</small>
    </div>

    <div class="container hidden" id="vault-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color: var(--primary-purple); font-size: 1rem;">ENCRYPTED LEDGER</h3>
            <button style="width: auto; background: var(--error-red); padding: 5px 15px; font-size: 0.7rem;" onclick="location.reload()">LOCK</button>
        </div>
        
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <input type="text" id="site" placeholder="Resource Name (e.g. GitHub)">
            <input type="text" id="username" placeholder="Identity / Email">
            <input type="password" id="password" placeholder="Secret Key">
            <button onclick="addEntry()">Store Secret</button>
        </div>

        <div id="entries-list" style="max-height: 250px; overflow-y: auto; margin-top: 20px;">
            </div>
    </div>

    <script>
        let db = [];
        const salt = new TextEncoder().encode("MSMAXPRO_STATIC_SALT_2026"); 

        async function getKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
            );
        }

        async function encrypt(text, key) {
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(text);
            const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, encoded);
            const buffer = new Uint8Array(iv.byteLength + ciphertext.byteLength);
            buffer.set(iv);
            buffer.set(new Uint8Array(ciphertext), iv.byteLength);
            return btoa(String.fromCharCode(...buffer));
        }

        async function decrypt(encryptedText, key) {
            try {
                const buffer = Uint8Array.from(atob(encryptedText), c => c.charCodeAt(0));
                const iv = buffer.slice(0, 12);
                const ciphertext = buffer.slice(12);
                const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) { return null; }
        }

        async function unlockVault() {
            const password = document.getElementById('master-password').value;
            if(!password) return;

            const key = await getKey(password);
            const storedData = localStorage.getItem('msmaxpro_vault');

            if(storedData) {
                const decryptedJson = await decrypt(storedData, key);
                if(decryptedJson) {
                    db = JSON.parse(decryptedJson);
                    renderEntries();
                    showVault();
                } else {
                    alert("ACCESS DENIED: Invalid Master Key.");
                }
            } else {
                if(confirm("Initialize new encrypted vault?")) {
                    db = [];
                    showVault();
                }
            }
            window.currentKey = key;
        }

        function showVault() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('vault-screen').classList.remove('hidden');
        }

        async function addEntry() {
            const site = document.getElementById('site').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if(!site || !pass) return;

            db.push({ site, user, pass, id: Date.now() });
            await saveVault();
            
            document.getElementById('site').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            renderEntries();
        }

        async function saveVault() {
            const json = JSON.stringify(db);
            const encrypted = await encrypt(json, window.currentKey);
            localStorage.setItem('msmaxpro_vault', encrypted);
        }

        function renderEntries() {
            const list = document.getElementById('entries-list');
            list.innerHTML = '';
            db.forEach((entry, index) => {
                const div = document.createElement('div');
                div.className = 'entry';
                div.innerHTML = `
                    <div style="font-weight: 800; color: var(--primary-purple);">${entry.site}</div>
                    <div style="font-size: 0.7rem; color: #64748b;">UID: ${entry.user || 'N/A'}</div>
                    <button class="copy-btn" onclick="copyPass('${entry.pass}')">COPY</button>
                    <button class="delete-btn" onclick="deleteEntry(${index})">PURGE</button>
                `;
                list.appendChild(div);
            });
        }

        function copyPass(pass) {
            navigator.clipboard.writeText(pass);
            alert("Secret key copied to secure clipboard.");
        }

        async function deleteEntry(index) {
            if(confirm("Purge this record from ledger?")) {
                db.splice(index, 1);
                await saveVault();
                renderEntries();
            }
        }
    </script>
</body>
</html>
