<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium BMI Calculator - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --input-focus: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-white);
            flex-direction: column;
        }

        .header-box {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 10px var(--accent-glow);
            background: var(--input-focus);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary-purple);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
            filter: brightness(1.1);
        }

        #result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-glow);
            display: none;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bmi-value {
            font-size: 3rem;
            font-weight: 900;
            margin: 5px 0;
            color: var(--primary-purple);
        }

        .status {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* Logic Based Colors */
        .underweight { color: #fbbf24; } 
        .normal { color: #22c55e; }      
        .overweight { color: #f97316; }  
        .obese { color: #f43f5e; }       

    </style>
</head>
<body>

    <div class="header-box">
        <h1>Health Metrics</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="card">
        <div class="input-group">
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="Enter height in cm">
        </div>

        <div class="input-group">
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter weight in kg">
        </div>

        <button onclick="calculateBMI()">Analyze Score</button>

        <div id="result-box">
            <div style="color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: 700;">Body Mass Index</div>
            <div class="bmi-value" id="bmi-val">0.0</div>
            <div class="status" id="bmi-status">Calculating...</div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            const h = document.getElementById('height').value;
            const w = document.getElementById('weight').value;
            const resultBox = document.getElementById('result-box');
            const valDisplay = document.getElementById('bmi-val');
            const statusDisplay = document.getElementById('bmi-status');

            if (h === '' || w === '' || h <= 0 || w <= 0) {
                alert("Please enter valid positive values!");
                return;
            }

            const bmi = (w / ((h / 100) ** 2)).toFixed(1);

            resultBox.style.display = 'block';
            valDisplay.textContent = bmi;

            // Clean previous status classes
            statusDisplay.className = 'status';
            valDisplay.style.color = "var(--primary-purple)"; 

            if (bmi < 18.5) {
                statusDisplay.textContent = "Underweight";
                statusDisplay.classList.add('underweight');
            } else if (bmi >= 18.5 && bmi < 24.9) {
                statusDisplay.textContent = "Healthy Weight";
                statusDisplay.classList.add('normal');
            } else if (bmi >= 25 && bmi < 29.9) {
                statusDisplay.textContent = "Overweight";
                statusDisplay.classList.add('overweight');
            } else {
                statusDisplay.textContent = "Obese Condition";
                statusDisplay.classList.add('obese');
            }
        }
    </script>
</body>
</html>
