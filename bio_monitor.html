<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Metric Pulse Scanner - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --error-red: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .main-scanner-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .monitor-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            margin-bottom: 20px;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transform: scaleX(-1);
        }
        
        .overlay-roi {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 2px dashed var(--primary-purple);
            border-radius: 50%;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        }

        .stats-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .bpm-display {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid var(--accent-glow);
        }

        .bpm-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-purple);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
            display: block;
        }

        .graph-container {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        canvas { width: 100%; height: 100%; }

        .status-bar {
            margin-top: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-purple);
            letter-spacing: 1px;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.4;
        }

        /* Scanline effect for video */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(139, 92, 246, 0.3);
            position: absolute;
            z-index: 5;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pulse Scanner</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="main-scanner-card">
        <div id="status" class="status-bar">SYSTEM INITIALIZING...</div>
        
        <div class="monitor-frame">
            <div class="scanline"></div>
            <video id="video" autoplay muted playsinline></video>
            <div class="overlay-roi"></div>
        </div>

        <div class="stats-row">
            <div class="bpm-display">
                <span class="bpm-value" id="bpm">--</span>
                <span class="label">Beats Per Minute</span>
            </div>
        </div>

        <div class="graph-container">
            <canvas id="graph"></canvas>
        </div>

        <div class="instructions">
            <b>GUIDE:</b> Place your face in the target circle. Maintain silence and stay still for 10 seconds.
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const graphCanvas = document.getElementById('graph');
        const ctx = graphCanvas.getContext('2d');
        const bpmDisplay = document.getElementById('bpm');
        const statusDisplay = document.getElementById('status');
        
        const ROI_SIZE = 50; 
        const SAMPLE_BUFFER_SIZE = 150; 
        
        let brightnessBuffer = [];
        let times = [];
        let canvasCtx = null;
        let frameCount = 0;

        // Camera Access
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } })
            .then(stream => {
                video.srcObject = stream;
                statusDisplay.innerText = "SENSOR ONLINE - CALIBRATING";
                
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 320;
                tempCanvas.height = 240;
                canvasCtx = tempCanvas.getContext('2d');
                
                requestAnimationFrame(processFrame);
            })
            .catch(err => {
                statusDisplay.innerText = "HARDWARE NOT FOUND";
                statusDisplay.style.color = "var(--error-red)";
            });

        function processFrame() {
            if (!canvasCtx || video.paused || video.ended) return;

            canvasCtx.drawImage(video, 0, 0, 320, 240);
            
            // Analyze Green Channel (Hemoglobin absorption is highest here)
            const frame = canvasCtx.getImageData((320/2)-(ROI_SIZE/2), (240/2)-(ROI_SIZE/2), ROI_SIZE, ROI_SIZE);
            const data = frame.data;
            
            let avgGreen = 0;
            for (let i = 0; i < data.length; i += 4) {
                avgGreen += data[i + 1]; 
            }
            avgGreen /= (data.length / 4);

            const now = Date.now();
            brightnessBuffer.push(avgGreen);
            times.push(now);
            
            if (brightnessBuffer.length > SAMPLE_BUFFER_SIZE) {
                brightnessBuffer.shift();
                times.shift();
            }

            drawGraph();
            
            if (frameCount % 15 === 0 && brightnessBuffer.length > 80) {
                calculateBPM();
            }
            
            frameCount++;
            requestAnimationFrame(processFrame);
        }

        function calculateBPM() {
            const min = Math.min(...brightnessBuffer);
            const max = Math.max(...brightnessBuffer);
            const normalized = brightnessBuffer.map(v => (v - min) / (max - min || 1));
            
            // Noise reduction (Moving Average)
            const smoothed = [];
            const windowSize = 4;
            for(let i=0; i<normalized.length; i++) {
                let sum = 0, count = 0;
                for(let j=Math.max(0, i-windowSize); j<Math.min(normalized.length, i+windowSize); j++) {
                    sum += normalized[j];
                    count++;
                }
                smoothed.push(sum/count);
            }

            let peaks = [];
            for (let i = 2; i < smoothed.length - 2; i++) {
                if (smoothed[i] > smoothed[i-1] && smoothed[i] > smoothed[i+1] && smoothed[i] > 0.6) {
                    peaks.push(times[i]);
                }
            }
            
            if (peaks.length >= 3) {
                let intervals = [];
                for(let i=1; i<peaks.length; i++) {
                    intervals.push(peaks[i] - peaks[i-1]);
                }
                const avgInterval = intervals.reduce((a,b) => a+b, 0) / intervals.length;
                const bpm = Math.round(60000 / avgInterval);
                
                if(bpm > 45 && bpm < 160) {
                    bpmDisplay.innerText = bpm;
                    statusDisplay.innerText = "SIGNAL STABLE - ANALYZING";
                }
            }
        }

        function drawGraph() {
            graphCanvas.width = graphCanvas.offsetWidth;
            graphCanvas.height = graphCanvas.offsetHeight;
            
            ctx.clearRect(0,0, graphCanvas.width, graphCanvas.height);
            ctx.strokeStyle = '#8b5cf6';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#8b5cf6';
            ctx.beginPath();
            
            const min = Math.min(...brightnessBuffer);
            const max = Math.max(...brightnessBuffer);
            const range = max - min || 1;
            
            for (let i = 0; i < brightnessBuffer.length; i++) {
                const x = (i / SAMPLE_BUFFER_SIZE) * graphCanvas.width;
                const y = graphCanvas.height - ((brightnessBuffer[i] - min) / range) * (graphCanvas.height * 0.8) - 10;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
