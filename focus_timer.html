<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - CodeWithMsMaxPro</title>
    <style>
        /* Website Theme Variables */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-purple: #8b5cf6;
            --text-white: #f8fafc;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --error-red: #f43f5e;
            --pause-yellow: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .web-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .timer-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
        }

        .circle-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        svg {
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        circle {
            fill: none;
            stroke-width: 12;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.4s ease, stroke 0.3s;
        }

        .circle-bg {
            stroke: rgba(15, 23, 42, 0.8);
        }

        .circle-progress {
            stroke: var(--primary-purple);
            stroke-dasharray: 816; /* 2 * PI * 130 */
            stroke-dashoffset: 0;
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px var(--primary-purple));
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-white);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .status {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .controls {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start { 
            background: var(--primary-purple); 
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .btn-start:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-reset { 
            background: transparent; 
            color: var(--error-red); 
            border: 1px solid var(--error-red);
        }
        .btn-reset:hover { 
            background: var(--error-red);
            color: white;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>Deep Focus</h1>
        <a href="https://codewithmsmaxpro.me" class="web-link">codewithmsmaxpro.me</a>
    </div>

    <div class="timer-card">
        <div class="circle-container">
            <svg width="280" height="280">
                <circle class="circle-bg" cx="140" cy="140" r="130"></circle>
                <circle class="circle-progress" id="progress" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="time-display" id="time">25:00</div>
        </div>

        <div class="status" id="status-text">INITIALIZING...</div>

        <div class="controls">
            <button class="btn-start" onclick="toggleTimer()" id="startBtn">Start Mission</button>
            <button class="btn-reset" onclick="resetTimer()">Abort</button>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timerId = null;
        let isRunning = false;

        const timeDisplay = document.getElementById('time');
        const progressCircle = document.getElementById('progress');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('status-text');
        
        const circumference = 2 * Math.PI * 130;
        progressCircle.style.strokeDasharray = circumference;

        function updateDisplay() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timeDisplay.textContent = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

            let offset = circumference - (timeLeft / totalTime) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = "Resume Session";
                statusText.textContent = "System Paused";
                startBtn.style.background = "var(--pause-yellow)";
            } else {
                isRunning = true;
                startBtn.textContent = "Pause Session";
                statusText.textContent = "Deep Focus Active";
                startBtn.style.background = "var(--primary-purple)";
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        statusText.textContent = "Task Completed!";
                        startBtn.textContent = "Start New";
                        playSound();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = 25 * 60;
            startBtn.textContent = "Start Mission";
            statusText.textContent = "Ready for Session";
            startBtn.style.background = "var(--primary-purple)";
            updateDisplay();
        }

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1);
            } catch(e) { console.log("Audio play failed"); }
        }

        statusText.textContent = "System Standby";
        updateDisplay();
    </script>
</body>
</html>
